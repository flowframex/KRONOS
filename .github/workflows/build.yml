# ╔══════════════════════════════════════════════════════════════════╗
# ║  NEXUS v2.0  —  GitHub Actions Build Workflow                   ║
# ║  Compiler : nvcc (CUDA 8.0)  +  MSVC host (VS 2022)            ║
# ║  Target   : Windows x64  (GT 730 GF108  CC 2.1  —  sm_21)      ║
# ║  Triggers : push to main/master  +  any version tag  (v*.*.*)   ║
# ║                                                                  ║
# ║  ⚠ WHY CUDA 8.0?                                                ║
# ║    sm_21 (Fermi) support was REMOVED in CUDA 9.0.               ║
# ║    8.0 is the last toolkit that can compile -arch=sm_21.        ║
# ║    -allow-unsupported-compiler lets nvcc 8.0 use VS 2022.       ║
# ╚══════════════════════════════════════════════════════════════════╝

name: NEXUS Build

on:
  push:
    branches: [ main, master ]
    tags:     [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:          # manual trigger from GitHub UI

jobs:
  build-windows:
    name: Build  (nvcc 8.0  ·  sm_21  ·  Windows x64)
    runs-on: windows-latest   # Windows Server 2022, VS 2022 pre-installed

    env:
      CUDA_VERSION: "8.0.61"
      CUDA_PKG_URL: "https://developer.nvidia.com/compute/cuda/8.0/Prod2/local_installers/cuda_8.0.61_windows-exe"
      CUDA_INSTALL_DIR: "C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v8.0"

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up MSVC x64 developer environment ───────────────────
      #   Gives us cl.exe as the nvcc host compiler + all SDK headers
      - name: Set up MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ── 3. Cache CUDA 8.0 installer (~1.3 GB) ─────────────────────
      #   Avoids re-downloading on every run — keyed to version string
      - name: Cache CUDA 8.0 installer
        id: cache-cuda
        uses: actions/cache@v4
        with:
          path: C:\cuda_installer
          key: cuda-${{ env.CUDA_VERSION }}-windows

      # ── 4. Download CUDA 8.0 (only on cache miss) ──────────────────
      - name: Download CUDA 8.0 installer
        if: steps.cache-cuda.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\cuda_installer | Out-Null
          Write-Host "Downloading CUDA $env:CUDA_VERSION installer (~1.3 GB) ..."
          Invoke-WebRequest `
            -Uri       $env:CUDA_PKG_URL `
            -OutFile   "C:\cuda_installer\cuda_8.0.61_windows.exe" `
            -UseBasicParsing

      # ── 5. Install CUDA 8.0 (compiler components only) ────────────
      #   We only need nvcc + headers + libs — skip display driver/samples
      #   Silent flags:  -s  compiler_8.0  cublas_dev_8.0  (min set)
      - name: Install CUDA 8.0 toolkit
        shell: cmd
        run: |
          echo Installing CUDA 8.0 (compiler + runtime components) ...
          "C:\cuda_installer\cuda_8.0.61_windows.exe" ^
            -s ^
            compiler_8.0 ^
            cudart_8.0 ^
            cublas_dev_8.0
          if %ERRORLEVEL% NEQ 0 (
            echo CUDA install returned %ERRORLEVEL% — checking if nvcc is present anyway
          )

      # ── 6. Verify nvcc is available and expose it ──────────────────
      - name: Verify nvcc and add to PATH
        shell: pwsh
        run: |
          $nvcc = "$env:CUDA_INSTALL_DIR\bin\nvcc.exe"
          if (!(Test-Path $nvcc)) {
            Write-Error "nvcc.exe not found at: $nvcc"
            exit 1
          }
          # Prepend CUDA bin to PATH for subsequent steps
          "$env:CUDA_INSTALL_DIR\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          Write-Host "nvcc found:"
          & $nvcc --version

      # ── 7. Compile NEXUS.cu ────────────────────────────────────────
      #   Flags mirror the file header exactly:
      #     -O2                              — full optimisation
      #     -arch=sm_21                      — GT 730 GF108 Fermi CC2.1
      #     -cudart static                   — no separate cudart.dll needed
      #     -allow-unsupported-compiler      — bypass MSVC 19.3x version check
      #     -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH
      #     -Xcompiler "/MT ..."             — static CRT + EH + suppress WX
      #     -luser32 -lgdi32                 — Win32 capture & overlay APIs
      #     -Xlinker "/SUBSYSTEM:WINDOWS"    — WinMain entry (GUI app)
      - name: Compile NEXUS.cu
        shell: cmd
        run: |
          nvcc ^
            -O2 ^
            -arch=sm_21 ^
            -cudart static ^
            -allow-unsupported-compiler ^
            -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH ^
            NEXUS.cu ^
            -o NEXUS.exe ^
            -Xcompiler "/MT /EHsc /W3 /WX- /D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH" ^
            -luser32 -lgdi32 ^
            -Xlinker "/SUBSYSTEM:WINDOWS /MACHINE:X64"

      # ── 8. Sanity-check the output binary ─────────────────────────
      - name: Verify NEXUS.exe
        shell: pwsh
        run: |
          if (!(Test-Path "NEXUS.exe")) {
            Write-Error "NEXUS.exe not found — build failed."
            exit 1
          }
          $size = (Get-Item "NEXUS.exe").Length / 1KB
          Write-Host "NEXUS.exe  —  $([math]::Round($size,1)) KB  — OK"

      # ── 9. Upload build artifact (every push) ─────────────────────
      - name: Upload NEXUS executable
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS_v2_sm21_x64
          path: NEXUS.exe
          retention-days: 30

      # ── 10. Create GitHub Release  (only on version tags) ──────────
      #   Push a tag like  v2.0.0  and this step fires automatically.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "NEXUS ${{ github.ref_name }}  —  The SOVEREIGN"
          body: |
            ## NEXUS Frame Generation Engine  ${{ github.ref_name }}

            **WHM Fusion · LK Optical Flow · FLGE · FASW · SOVEREIGN**

            ### Target hardware
            | Component | Spec |
            |---|---|
            | GPU | GT 730 GF108 Fermi  (DDR3 64-bit bus)  CC 2.1 |
            | CPU | Intel Core i3-2120 |
            | RAM | 6 GB DDR3 |
            | Driver | NVIDIA ≥ 367.48 |
            | OS | Windows 10/11 x64 |

            ### What's inside (v2.0 — The SOVEREIGN)
            | Feature | Detail |
            |---|---|
            | Crown Fusion | WHM: F\* = W / (w\_w/F\_warp + w\_t/F\_temp + w\_s/F\_spat) |
            | Optical Flow | Lucas-Kanade 5×5, GPU shared-mem tiles |
            | FLGE | Log-geodesic Taylor extrapolation in linear light |
            | FASW | Anisotropic wave PDE in linear light |
            | SHM Tile | F2 (uchar4) + flow (float2) = 3888 B/block → 12 blocks/SM |
            | CUDA | Stream + events, true async DMA — no cudaDeviceSynchronize |
            | Toggle | F9 global hotkey to enable/disable engine |

            ### v2.0 key fixes over v1.1
            - OFC corrected: `|It + v·∇L| / (|It| + |v||∇L| + ε)`
            - `d_sat` bug removed (was duplicate of `d_clamp01`)
            - Aniso kernel weights computed once for RGB (54 → 9 expf/px)
            - Persistent DIBSection — no per-frame alloc in blit/capture
            - Adaptive frame pacing via real FPS EMA

            ### How to run
            ```
            NEXUS.exe
            ```
            Requires Windows 10/11 x64, NVIDIA GPU (Fermi CC2.1+), driver ≥ 367.48.
            Run as Administrator for full Desktop Duplication capture coverage.

            ### Build info
            Compiled with `nvcc -O2 -arch=sm_21 -cudart static /MT`
            No CUDA runtime DLL needed — fully static.

          files: NEXUS.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
